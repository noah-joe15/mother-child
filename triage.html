<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Triage - MNH RCH</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Load Libraries ONLY (No inline Supabase code here to prevent conflicts) -->
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Premium Navigation -->
    <nav class="navbar">
        <div class="container nav-inner">
            <a href="/nurse-dashboard" class="back-link" style="margin: 0;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Dashboard
            </a>
            
            <div class="logo-text" style="font-size: 16px;">
                MNH RCH
                <span style="font-size: 11px;">Clinical Triage</span>
            </div>
            
            <div id="network_status" class="network-badge offline">
                <span id="network_text">OFFLINE</span>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: 40px; padding-bottom: 80px; max-width: 700px;">
        
        <!-- Patient Registration Card -->
        <div class="patient-card" id="registration_section">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
                <div class="feature-icon" style="margin: 0; background: var(--blue-soft); color: var(--blue-accent);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </div>
                <div>
                    <h2 style="font-size: 20px; margin-bottom: 4px;">New Patient Registration</h2>
                    <p style="font-size: 13px; color: var(--text-muted);">Capture mother and child information</p>
                </div>
            </div>

            <form id="patient_form">
                <div class="form-group">
                    <label>Mother's Full Name *</label>
                    <input type="text" id="mother_name" required placeholder="e.g., Sarah John Mwashambwa">
                </div>

                <div class="form-group">
                    <label>Child's Name</label>
                    <input type="text" id="child_name" placeholder="e.g., Neema Sarah">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label>Child's Date of Birth</label>
                        <input type="date" id="child_dob">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone_number" placeholder="0712345678">
                    </div>
                </div>

                <div class="form-group">
                    <label>Social Health Authority (SHA) Number</label>
                    <input type="text" id="sha_number" placeholder="SHA ID or Insurance Number">
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 8px;">
                    Register & Continue to Vitals
                </button>
            </form>
        </div>

        <!-- Vitals Section (Hidden Initially) -->
        <div id="vitals_section" class="patient-card" style="display: none; margin-top: 24px;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
                <div class="feature-icon" style="margin: 0; background: #dcfce7; color: #16a34a;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </div>
                <div>
                    <h2 style="font-size: 20px; margin-bottom: 4px;">Record Vital Signs</h2>
                    <p style="font-size: 13px; color: var(--text-muted);">Measure and document patient vitals</p>
                </div>
            </div>

            <div class="patient-summary" id="patient_summary" style="margin-bottom: 24px;">
                <!-- Patient info will be inserted here by triage.js -->
            </div>

            <div class="form-group">
                <label>Weight (kg) *</label>
                <input type="number" step="0.01" id="weight_kg" required placeholder="e.g., 7.50">
            </div>

            <div class="form-group">
                <label>MUAC - Mid-Upper Arm Circumference (mm) *</label>
                <input type="number" id="muac_mm" required placeholder="e.g., 120">
                <p style="font-size: 12px; color: var(--text-light); margin-top: 4px;">Measure at the midpoint between shoulder and elbow</p>
            </div>

            <div class="form-group">
                <label>Body Temperature (°C) *</label>
                <input type="number" step="0.1" id="temperature" required placeholder="e.g., 36.5">
            </div>

            <!-- Dynamic Nutrition Status Box -->
            <div id="nutrition_status" class="status-box neutral">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <span id="status_text">Enter MUAC to check nutritional status</span>
            </div>

            <button id="save_vitals_btn" class="btn-primary" style="margin-top: 8px;">
                Save & Send to Doctor's Queue
            </button>
        </div>

    </main>

    <!-- Load the Clinical Engine (This handles ALL the logic safely) -->
    <script src="/triage.js"></script>
</body>
</html>
