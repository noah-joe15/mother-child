<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNH RCH - Nurse Triage</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="header-brand">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
            <h1>MNH RCH - Triage</h1>
        </div>
        <div id="network_status" class="network-badge offline">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
            <span id="network_text">OFFLINE</span>
        </div>
    </header>

    <main class="container">
        <!-- User Info -->
        <div class="user-bar">
            <span id="user_info">Loading...</span>
            <button onclick="logout()" class="btn-logout-small">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>

        <!-- Patient Registration Section -->
        <div class="patient-card">
            <h3>Patient Information</h3>
            <form id="patient_form" class="form-grid">
                <div class="form-group">
                    <label for="mother_name">Mother's Name *</label>
                    <input type="text" id="mother_name" required placeholder="Full name">
                </div>

                <div class="form-group">
                    <label for="child_name">Child's Name</label>
                    <input type="text" id="child_name" placeholder="Baby's name">
                </div>

                <div class="form-group">
                    <label for="child_dob">Child's Date of Birth</label>
                    <input type="date" id="child_dob">
                </div>

                <div class="form-group">
                    <label for="phone_number">Phone Number</label>
                    <input type="tel" id="phone_number" placeholder="e.g., 0712345678">
                </div>

                <div class="form-group">
                    <label for="sha_number">SHA Number (Insurance)</label>
                    <input type="text" id="sha_number" placeholder="SHA ID">
                </div>

                <div class="form-group full-width">
                    <button type="submit" class="btn-primary">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                        Register Patient & Continue
                    </button>
                </div>
            </form>
        </div>

        <!-- Vitals Section (Hidden until patient is registered) -->
        <div id="vitals_section" class="vitals-card" style="display: none;">
            <h3>Record Vitals</h3>
            
            <div class="patient-summary" id="patient_summary">
                <!-- Patient info will be displayed here -->
            </div>

            <form id="vitals_form">
                <div class="form-group">
                    <label for="weight_kg">Weight (kg) *</label>
                    <input type="number" step="0.01" id="weight_kg" required placeholder="e.g., 7.5">
                </div>

                <div class="form-group">
                    <label for="muac_mm">MUAC (mm) - Arm Circumference *</label>
                    <input type="number" id="muac_mm" oninput="calculateNutritionStatus()" required placeholder="e.g., 120">
                    <small class="form-hint">Measure mid-upper arm circumference</small>
                </div>

                <div class="form-group">
                    <label for="temperature">Temperature (°C) *</label>
                    <input type="number" step="0.1" id="temperature" required placeholder="e.g., 36.5">
                </div>

                <!-- Smart Status Box -->
                <div id="nutrition_status" class="status-box neutral">
                    <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span id="status_text">Enter MUAC to check nutritional status</span>
                </div>

                <button type="button" onclick="saveVitalsOffline()" class="btn-primary btn-large">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Save & Send to Doctor's Queue
                </button>
            </form>
        </div>
    </main>

    <script>
        // ==========================================
        // SUPABASE & DEXIE SETUP
        // ==========================================
        const SUPABASE_URL = 'https://fmaaudmdgmgklvqcmvad.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtYWF1ZG1kZ21na2x2cWNtdmFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzk2MjMsImV4cCI6MjEwMjcxNTYyM30.yGKizF1gywUIctA_VKDVuI9YO8rH7i-kfQ2RfDb2u_E';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const db = new Dexie("MNHRCHDatabase");
        db.version(1).stores({
            patients: '++id, mother_name, phone_number',
            vitals: '++id, patient_id, synced',
            queue: '++id, patient_id, status'
        });

        let currentPatientId = null;

        // ==========================================
        // AUTH CHECK
        // ==========================================
        async function initTriage() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                window.location.href = '/login';
                return;
            }

            const { data: profile } = await supabase
                .from('profiles')
                .select('role, full_name')
                .eq('id', session.user.id)
                .single();

            if (!profile || profile.role !== 'nurse') {
                alert('Access denied. Nurses only.');
                window.location.href = '/dashboard';
                return;
            }

            document.getElementById('user_info').textContent = `Nurse: ${profile.full_name}`;
            updateNetworkStatus();
        }

        // ==========================================
        // PATIENT REGISTRATION
        // ==========================================
        document.getElementById('patient_form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const patientData = {
                mother_name: document.getElementById('mother_name').value,
                child_name: document.getElementById('child_name').value || 'Baby',
                child_dob: document.getElementById('child_dob').value,
                phone_number: document.getElementById('phone_number').value,
                sha_number: document.getElementById('sha_number').value
            };

            // Save to Supabase
            const { data, error } = await supabase
                .from('patients')
                .insert(patientData)
                .select()
                .single();

            if (error) {
                alert('Error registering patient: ' + error.message);
                return;
            }

            currentPatientId = data.id;
            
            // Show vitals section
            document.getElementById('vitals_section').style.display = 'block';
            document.getElementById('patient_summary').innerHTML = `
                <div class="summary-badge">
                    <strong>Patient:</strong> ${data.child_name} (Mother: ${data.mother_name})
                </div>
            `;

            // Scroll to vitals
            document.getElementById('vitals_section').scrollIntoView({ behavior: 'smooth' });
        });

        // ==========================================
        // SMART TRIAGE UI LOGIC (MUAC Color Coding)
        // ==========================================
        function calculateNutritionStatus() {
            const muacInput = document.getElementById('muac_mm');
            const statusBox = document.getElementById('nutrition_status');
            const muacValue = parseInt(muacInput.value);

            statusBox.className = 'status-box';

            if (isNaN(muacValue)) {
                statusBox.classList.add('neutral');
                statusBox.innerHTML = `
                    <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span id="status_text">Enter MUAC to check nutritional status</span>
                `;
                return;
            }

            if (muacValue < 115) {
                statusBox.classList.add('danger');
                statusBox.innerHTML = `
                    <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span id="status_text">SEVERE MALNUTRITION (RED) - Immediate Doctor Attention!</span>
                `;
            } else if (muacValue >= 115 && muacValue < 125) {
                statusBox.classList.add('warning');
                statusBox.innerHTML = `
                    <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span id="status_text">MODERATE MALNUTRITION (YELLOW) - Monitor Closely</span>
                `;
            } else {
                statusBox.classList.add('success');
                statusBox.innerHTML = `
                    <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <span id="status_text">HEALTHY (GREEN) - Proceed to Vaccination</span>
                `;
            }
        }

        // ==========================================
        // SAVE VITALS OFFLINE-FIRST
        // ==========================================
        async function saveVitalsOffline() {
            const weight = document.getElementById('weight_kg').value;
            const muac = document.getElementById('muac_mm').value;
            const temp = document.getElementById('temperature').value;

            if (!weight || !muac || !temp || !currentPatientId) {
                alert('Please fill in all vitals fields.');
                return;
            }

            // Save to local DB first (works offline)
            await db.vitals.add({
                patient_id: currentPatientId,
                weight_kg: parseFloat(weight),
                muac_mm: parseInt(muac),
                temperature: parseFloat(temp),
                synced: 0
            });

            // Add to queue for Doctor
            const { error: queueError } = await supabase
                .from('queue')
                .insert({
                    patient_id: currentPatientId,
                    current_station: 'Doctor',
                    status: 'Waiting'
                });

            if (queueError) {
                console.error('Queue error:', queueError);
            }

            alert('Vitals saved! Patient added to Doctor\'s queue.');
            syncVitalsToCloud();

            // Reset form
            document.getElementById('vitals_form').reset();
            document.getElementById('patient_form').reset();
            document.getElementById('vitals_section').style.display = 'none';
            currentPatientId = null;
            calculateNutritionStatus();
        }

        // ==========================================
        // SYNC ENGINE
        // ==========================================
        async function syncVitalsToCloud() {
            if (!navigator.onLine) return;

            const unsyncedVitals = await db.vitals.where('synced').equals(0).toArray();
            if (unsyncedVitals.length === 0) return;

            for (let vital of unsyncedVitals) {
                const { error } = await supabase
                    .from('vitals')
                    .insert({
                        patient_id: vital.patient_id,
                        weight_kg: vital.weight_kg,
                        muac_mm: vital.muac_mm,
                        temperature: vital.temperature
                    });

                if (!error) {
                    await db.vitals.update(vital.id, { synced: 1 });
                }
            }
        }

        window.addEventListener('online', syncVitalsToCloud);
        setInterval(syncVitalsToCloud, 30000);

        // ==========================================
        // NETWORK STATUS
        // ==========================================
        function updateNetworkStatus() {
            const badge = document.getElementById('network_status');
            const text = document.getElementById('network_text');
            
            if (navigator.onLine) {
                text.textContent = 'ONLINE';
                badge.className = 'network-badge online';
            } else {
                text.textContent = 'OFFLINE';
                badge.className = 'network-badge offline';
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // ==========================================
        // LOGOUT
        // ==========================================
        async function logout() {
            await supabase.auth.signOut();
            localStorage.clear();
            window.location.href = '/login';
        }

        // Initialize
        initTriage();
    </script>
</body>
</html>
