<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNH RCH - Nurse Triage</title>
    <link rel="stylesheet" href="/style.css">
    
    <!-- Load libraries directly and simply -->
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="app-header">
        <div class="header-brand">
            <h1>MNH RCH - Triage</h1>
        </div>
    </header>

    <main class="container">
        <div class="user-bar">
            <span id="user_info">Checking login...</span>
            <button id="logoutBtn" class="btn-logout-small">Logout</button>
        </div>

        <div class="patient-card">
            <h3>Patient Information</h3>
            <form id="patient_form">
                <div class="form-group">
                    <label>Mother's Name *</label>
                    <input type="text" id="mother_name" required placeholder="Full name">
                </div>
                <div class="form-group">
                    <label>Child's Name</label>
                    <input type="text" id="child_name" placeholder="Baby's name">
                </div>
                <div class="form-group full-width">
                    <button type="submit" class="btn-primary">Register Patient</button>
                </div>
            </form>
        </div>

        <div id="vitals_section" class="vitals-card" style="display: none;">
            <h3>Record Vitals</h3>
            <div class="patient-summary" id="patient_summary"></div>

            <div class="form-group">
                <label>Weight (kg) *</label>
                <input type="number" step="0.01" id="weight_kg" placeholder="7.5">
            </div>

            <div class="form-group">
                <label>MUAC (mm) *</label>
                <input type="number" id="muac_mm" placeholder="120">
            </div>

            <div class="form-group">
                <label>Temperature (°C) *</label>
                <input type="number" step="0.1" id="temperature" placeholder="36.5">
            </div>

            <!-- THE BUTTON WE ARE TESTING -->
            <button id="saveBtn" class="btn-primary btn-large">Save & Next Station</button>
        </div>
    </main>

    <script>
        // Wait for the page to fully load before running anything
        document.addEventListener('DOMContentLoaded', async function() {
            console.log("Page loaded. Starting initialization...");

            // 1. Check if libraries loaded
            if (typeof window.supabase === 'undefined' || typeof window.Dexie === 'undefined') {
                alert("ERROR: Supabase or Dexie failed to load. Check your internet connection or adblocker.");
                return;
            }

            // 2. Initialize
            const supabase = window.supabase.createClient(
                'https://fmaaudmdgmgklvqcmvad.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtYWF1ZG1kZ21na2x2cWNtdmFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzk2MjMsImV4cCI6MjEwMjcxNTYyM30.yGKizF1gywUIctA_VKDVuI9YO8rH7i-kfQ2RfDb2u_E'
            );

            const db = new window.Dexie("MNHRCHDatabase");
            db.version(1).stores({
                vitals: '++id, patient_id, synced',
                queue: '++id, patient_id, status'
            });

            let currentPatientId = null;

            // 3. Check Login
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/login';
                return;
            }
            document.getElementById('user_info').textContent = 'Logged in';

            // 4. TEST THE BUTTON IMMEDIATELY
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.addEventListener('click', async function() {
                alert("SUCCESS: The button is working! JavaScript is connected.");
                
                const weight = document.getElementById('weight_kg').value;
                const muac = document.getElementById('muac_mm').value;
                const temp = document.getElementById('temperature').value;

                if (!weight || !muac || !temp) {
                    alert("Please fill in all vitals fields.");
                    return;
                }

                try {
                    // Save to local database
                    await db.vitals.add({
                        patient_id: currentPatientId || 999, // fallback for testing
                        weight_kg: parseFloat(weight),
                        muac_mm: parseInt(muac),
                        temperature: parseFloat(temp),
                        synced: 0
                    });
                    alert("Saved to local database successfully!");
                    
                    // Reset form
                    document.getElementById('weight_kg').value = '';
                    document.getElementById('muac_mm').value = '';
                    document.getElementById('temperature').value = '';
                } catch (error) {
                    alert("Error saving: " + error.message);
                }
            });

            // 5. Patient Form Handler
            document.getElementById('patient_form').addEventListener('submit', async function(e) {
                e.preventDefault();
                alert("Patient registered! Showing vitals section.");
                document.getElementById('vitals_section').style.display = 'block';
                document.getElementById('patient_summary').textContent = "Testing Mode";
                currentPatientId = 999; // Mock ID for testing
            });

            // 6. Logout Handler
            document.getElementById('logoutBtn').addEventListener('click', async function() {
                await supabase.auth.signOut();
                window.location.href = '/login';
            });
        });
    </script>
</body>
</html>
