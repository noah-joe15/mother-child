<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNH RCH - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="app-header">
        <div class="header-brand">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <h1>MNH RCH Admin</h1>
        </div>
        <div class="header-user">
            <span id="user_info">Loading...</span>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </header>

    <main class="dashboard-container">
        <div id="admin_content" style="display: none;">
            <div class="station-header">
                <h2>System Overview</h2>
                <div class="queue-stats">
                    <div class="stat-card">
                        <span class="stat-number" id="total_patients">0</span>
                        <span class="stat-label">Total Patients</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="active_queue">0</span>
                        <span class="stat-label">Active in Queue</span>
                    </div>
                </div>
            </div>

            <div class="queue-list">
                <h3 style="padding: 1rem; border-bottom: 1px solid #e0e0e0;">Recent Vitals Synced</h3>
                <div id="recent_vitals_list">
                    <div class="loading-state"><p>Loading data...</p></div>
                </div>
            </div>
        </div>

        <div id="access_denied" style="display: none; text-align: center; padding: 3rem;">
            <svg class="icon" style="width: 64px; height: 64px; color: #dc3545;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <h2 style="color: #dc3545; margin-top: 1rem;">Access Denied</h2>
            <p style="color: #666;">You do not have administrator privileges to view this page.</p>
            <a href="dashboard.html" class="btn-primary" style="display: inline-block; margin-top: 1rem; text-decoration: none; width: auto; padding: 0.75rem 1.5rem;">Return to Dashboard</a>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fmaaudmdgmgklvqcmvad.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtYWF1ZG1kZ21na2x2cWNtdmFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzk2MjMsImV4cCI6MjEwMjcxNTYyM30.yGKizF1gywUIctA_VKDVuI9YO8rH7i-kfQ2RfDb2u_E';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initAdmin() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            // Check if user is actually an admin
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('role, full_name')
                .eq('id', session.user.id)
                .single();

            if (error || profile.role !== 'admin') {
                document.getElementById('access_denied').style.display = 'block';
                document.getElementById('admin_content').style.display = 'none';
                return;
            }

            // User is admin, show content
            document.getElementById('user_info').textContent = `${profile.full_name} (Administrator)`;
            document.getElementById('admin_content').style.display = 'block';
            
            loadAdminStats();
        }

        async function loadAdminStats() {
            // Get total patients
            const { count: patientCount } = await supabase.from('patients').select('*', { count: 'exact', head: true });
            document.getElementById('total_patients').textContent = patientCount || 0;

            // Get active queue
            const { count: queueCount } = await supabase.from('queue').select('*', { count: 'exact', head: true }).eq('status', 'Waiting');
            document.getElementById('active_queue').textContent = queueCount || 0;

            // Get recent vitals
            const { data: vitals, error } = await supabase
                .from('vitals')
                .select(`
                    weight_kg,
                    muac_mm,
                    temperature,
                    recorded_at,
                    patients (mother_name, child_name)
                `)
                .order('recorded_at', { ascending: false })
                .limit(5);

            const vitalsList = document.getElementById('recent_vitals_list');
            if (vitals && vitals.length > 0) {
                vitalsList.innerHTML = vitals.map(v => `
                    <div class="queue-item">
                        <div class="patient-name">
                            <strong>${v.patients?.child_name || 'Unknown Child'}</strong>
                            <span class="patient-mother">Mother: ${v.patients?.mother_name || 'Unknown'} | W: ${v.weight_kg}kg | MUAC: ${v.muac_mm}mm</span>
                        </div>
                        <span class="queue-time">${new Date(v.recorded_at).toLocaleString()}</span>
                    </div>
                `).join('');
            } else {
                vitalsList.innerHTML = '<div class="empty-state"><p>No vitals recorded yet.</p></div>';
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            localStorage.clear();
            window.location.href = 'login.html';
        }

        initAdmin();
    </script>
</body>
</html>
