<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNH RCH - Queue Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="header-brand">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
            <h1>MNH RCH Dashboard</h1>
        </div>
        <div class="header-user">
            <span id="user_info">Loading...</span>
            <button onclick="logout()" class="btn-logout">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Station Info -->
        <div class="station-header">
            <h2 id="station_title">Queue Dashboard</h2>
            <div class="queue-stats">
                <div class="stat-card">
                    <span class="stat-number" id="waiting_count">0</span>
                    <span class="stat-label">Waiting</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="progress_count">0</span>
                    <span class="stat-label">In Progress</span>
                </div>
            </div>
        </div>

        <!-- Queue List -->
        <div class="queue-list" id="queue_list">
            <div class="loading-state">
                <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                    <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"></path>
                </svg>
                <p>Loading queue...</p>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
