<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Portal - MNH RCH</title>
    <link rel="stylesheet" href="/style.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="logo">
                <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M2 12h20"/></svg></div>
                <div class="logo-text">MNH RCH <span>Doctor Portal</span></div>
            </a>
            <div style="display: flex; align-items: center; gap: 16px;">
                <span id="user_info" style="font-size: 14px; font-weight: 600;">Loading...</span>
                <button onclick="handleLogout()" style="background: transparent; border: 1px solid #e5e7eb; color: #0f172a; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='#fee2e2'; this.style.borderColor='#ef4444'; this.style.color='#ef4444'" onmouseout="this.style.background='transparent'; this.style.borderColor='#e5e7eb'; this.style.color='#0f172a'">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container" style="padding: 40px 20px; max-width: 1000px;">
        
        <div id="loading_message" style="text-align: center; padding: 60px; color: var(--text-muted);">
            <p>Loading doctor portal...</p>
        </div>

        <div id="doctor_content" style="display: none;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                <div>
                    <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">Patient Queue</h1>
                    <p style="color: var(--text-muted);">Review patients and manage care</p>
                </div>
                <div style="display: flex; gap: 16px;">
                    <div class="feature-card" style="text-align: center; padding: 16px 24px;">
                        <h3 id="waiting_count" style="font-size: 32px; color: #d97706; margin: 0;">0</h3>
                        <p style="font-size: 12px; color: var(--text-light); margin: 4px 0 0;">Waiting</p>
                    </div>
                    <div class="feature-card" style="text-align: center; padding: 16px 24px;">
                        <h3 id="progress_count" style="font-size: 32px; color: #2563eb; margin: 0;">0</h3>
                        <p style="font-size: 12px; color: var(--text-light); margin: 4px 0 0;">In Progress</p>
                    </div>
                </div>
            </div>

            <div class="patient-card" style="padding: 32px;">
                <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 24px;">Active Patients</h3>
                <div id="queue_list">
                    <p style="color: var(--text-muted); text-align: center; padding: 40px;">Loading queue...</p>
                </div>
            </div>

        </div>
    </main>

    <script>
        console.log('[Doctor] Page loaded');
        
        // Renamed to supabaseClient to avoid conflict
        const supabaseClient = window.supabase.createClient(
            'https://fmaaudmdgmgklvqcmvad.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtYWF1ZG1kZ21na2x2cWNtdmFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzk2MjMsImV4cCI6MjEwMjcxNTYyM30.yGKizF1gywUIctA_VKDVuI9YO8rH7i-kfQ2RfDb2u_E'
        );

        async function initDoctor() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }

                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('full_name, role')
                    .eq('id', session.user.id)
                    .single();

                if (!profile) {
                    window.location.href = 'login.html';
                    return;
                }

                document.getElementById('user_info').textContent = `Dr. ${profile.full_name}`;
                document.getElementById('loading_message').style.display = 'none';
                document.getElementById('doctor_content').style.display = 'block';
                
                loadQueue();
                
                // Real-time updates
                supabaseClient.channel('queue_updates')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'queue' }, () => {
                        console.log('[Doctor] Queue updated');
                        loadQueue();
                    })
                    .subscribe();

            } catch (error) {
                console.error('[Doctor] Init error:', error);
            }
        }

        async function loadQueue() {
            try {
                const { data, error } = await supabaseClient
                    .from('queue')
                    .select('*, patients(mother_name, child_name), vitals(weight_kg, muac_mm, temperature)')
                    .eq('current_station', 'Doctor')
                    .order('created_at', { ascending: true });

                if (error) throw error;

                const waiting = data.filter(q => q.status === 'Waiting').length;
                const progress = data.filter(q => q.status === 'In-Progress').length;
                
                document.getElementById('waiting_count').textContent = waiting;
                document.getElementById('progress_count').textContent = progress;

                const list = document.getElementById('queue_list');
                
                if (!data || data.length === 0) {
                    list.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px;">No patients in queue</p>';
                    return;
                }

                list.innerHTML = data.map(q => {
                    const patient = q.patients || {};
                    const vitals = q.vitals?.[0] || {};
                    const statusColor = q.status === 'Waiting' ? '#d97706' : '#2563eb';
                    
                    return `
                        <div style="padding: 20px; background: #f8fafc; border-radius: 12px; margin-bottom: 16px; border-left: 4px solid ${statusColor};">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                                <div>
                                    <h4 style="font-size: 16px; font-weight: 700; margin: 0 0 4px;">${patient.child_name || 'Unknown'}</h4>
                                    <p style="font-size: 13px; color: var(--text-muted); margin: 0;">Mother: ${patient.mother_name || 'Unknown'}</p>
                                </div>
                                <span style="padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; background: ${statusColor}20; color: ${statusColor};">${q.status}</span>
                            </div>
                            
                            ${vitals.weight_kg ? `
                            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; background: white; border-radius: 8px; margin-bottom: 12px;">
                                <div style="text-align: center;">
                                    <div style="font-size: 11px; color: var(--text-light);">Weight</div>
                                    <div style="font-size: 16px; font-weight: 700;">${vitals.weight_kg} kg</div>
                                </div>
                                <div style="text-align: center;">
                                    <div style="font-size: 11px; color: var(--text-light);">MUAC</div>
                                    <div style="font-size: 16px; font-weight: 700; color: ${vitals.muac_mm < 115 ? '#ef4444' : vitals.muac_mm < 125 ? '#d97706' : '#16a34a'}">${vitals.muac_mm} mm</div>
                                </div>
                                <div style="text-align: center;">
                                    <div style="font-size: 11px; color: var(--text-light);">Temp</div>
                                    <div style="font-size: 16px; font-weight: 700;">${vitals.temperature}°C</div>
                                </div>
                            </div>
                            ` : ''}
                            
                            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                                ${q.status === 'Waiting' ? `
                                    <button onclick="updateStatus('${q.id}', 'In-Progress')" class="btn-primary" style="width: auto; padding: 8px 16px; font-size: 13px;">Start Consultation</button>
                                ` : `
                                    <button onclick="updateStatus('${q.id}', 'Completed', 'Pharmacy')" class="btn-primary" style="width: auto; padding: 8px 16px; font-size: 13px; background: #16a34a;">Send to Pharmacy</button>
                                `}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('[Doctor] Load error:', error);
            }
        }

        async function updateStatus(queueId, newStatus, nextStation = null) {
            try {
                const updateData = { status: newStatus, updated_at: new Date().toISOString() };
                if (nextStation) updateData.current_station = nextStation;
                
                await supabaseClient.from('queue').update(updateData).eq('id', queueId);
                loadQueue();
            } catch (error) {
                console.error('[Doctor] Update error:', error);
                alert('Failed to update status');
            }
        }

        async function handleLogout() {
            console.log('[Doctor] Logout initiated');
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        initDoctor();
    </script>
</body>
</html>
