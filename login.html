<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - MNH RCH E-Clinic</title>
    <link rel="stylesheet" href="/style.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Load Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-inner" style="justify-content: center;">
            <a href="index.html" class="logo">
                <div class="logo-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M2 12h20"/></svg>
                </div>
                <div class="logo-text">MNH RCH <span>Secure Staff Portal</span></div>
            </a>
        </div>
    </nav>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: linear-gradient(135deg, #FFFFF0 0%, #F5F0E1 100%);">
        <div style="width: 100%; max-width: 440px;">
            
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="display: inline-flex; align-items: center; gap: 8px; background: #FDF5E6; border: 1px solid #e5e7eb; padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 600; color: #1e3a8a; margin-bottom: 24px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width: 18px; height: 18px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <span>Official National E-Clinic Tracking Card</span>
                </div>
                <h1 style="font-size: 32px; font-weight: 800; color: #0f172a; margin-bottom: 12px;">Welcome Back</h1>
                <p style="font-size: 15px; color: #475569;">Please enter your credentials to access the clinical dashboard.</p>
            </div>

            <div style="background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px; box-shadow: 0 12px 32px rgba(30, 58, 138, 0.08);">
                <form id="login_form">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #0f172a; margin-bottom: 8px;">Staff Email Address</label>
                        <input type="email" id="email" required placeholder="name@mnh.go.tz" style="width: 100%; padding: 12px 16px; font-size: 15px; color: #0f172a; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; outline: none; box-sizing: border-box;">
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #0f172a; margin-bottom: 8px;">Password</label>
                        <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding: 12px 16px; font-size: 15px; color: #0f172a; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; outline: none; box-sizing: border-box;">
                    </div>

                    <button type="submit" style="width: 100%; padding: 14px; background: #1e3a8a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;">Sign In to Dashboard</button>

                    <div id="login_error" style="margin-top: 16px; padding: 12px; background: #fee2e2; border: 1px solid #fca5a5; border-radius: 8px; color: #991b1b; font-size: 13px; text-align: center; display: none;"></div>
                </form>
            </div>

            <div style="text-align: center; margin-top: 32px;">
                <a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; color: #64748b; text-decoration: none; font-size: 14px; font-weight: 600;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width: 16px; height: 16px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Return to Public Home Page
                </a>
            </div>

        </div>
    </main>

    <footer style="background: white; border-top: 1px solid #e5e7eb; padding: 24px 20px; text-align: center; font-size: 13px; color: #64748b;">
        <p>Built with pride in Tanzania · <strong>MNH RCH E-Clinic</strong> · Aligned with Dira ya Taifa 2050</p>
    </footer>

    <!-- Load Auth Engine AFTER Supabase -->
    <script src="/auth.js?v=6"></script>
</body>
</html>
