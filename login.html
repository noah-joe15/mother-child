<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - MNH RCH E-Clinic</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Load Supabase FIRST, then our auth engine -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth.js"></script>
</head>
<body>

    <!-- Simplified Navigation for Login -->
    <nav class="navbar">
        <div class="container nav-inner" style="justify-content: center;">
            <a href="/" class="logo">
                <div class="logo-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M2 12h20"/>
                    </svg>
                </div>
                <div class="logo-text">
                    MNH RCH
                    <span>Secure Staff Portal</span>
                </div>
            </a>
        </div>
    </nav>

    <!-- Login Container -->
    <main class="container">
        <div class="login-container">
            
            <div class="login-header">
                <div class="badge" style="margin-bottom: 24px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Official National E-Clinic Tracking Card</span>
                </div>
                <h1>Welcome Back</h1>
                <p>Please enter your credentials to access the clinical dashboard.</p>
            </div>

            <div class="login-card">
                <form id="login_form">
                    <div class="form-group">
                        <label for="email">Staff Email Address</label>
                        <input type="email" id="email" required placeholder="name@mnh.go.tz" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 8px;">
                        Sign In to Dashboard
                    </button>

                    <!-- Error Message Container (Hidden by default, shown by auth.js) -->
                    <div id="login_error" style="display: none; margin-top: 16px; padding: 12px; background: #fee2e2; border: 1px solid #fca5a5; border-radius: 8px; color: #991b1b; font-size: 13px; font-weight: 500; text-align: center;">
                    </div>
                </form>
            </div>

            <div style="text-align: center; margin-top: 32px;">
                <a href="/" class="back-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Return to Public Home Page
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>Built with pride in Tanzania · <strong>MNH RCH E-Clinic</strong> · Aligned with Dira ya Taifa 2050</p>
        </div>
    </footer>

</body>
</html>
