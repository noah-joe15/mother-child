<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a8a">
    <title>Mother Login - MNH RCH</title>
    <link rel="stylesheet" href="/style.css?v=7">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: linear-gradient(135deg, #FFFFF0 0%, #FDF5E6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 12px 32px rgba(30, 58, 138, 0.12);
            max-width: 420px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }

        .login-header p {
            color: #64748b;
            font-size: 14px;
            margin: 0;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            background: #f8fafc;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary:hover:not(:disabled) {
            background: #3b82f6;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .otp-status {
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.5;
            display: none;
        }

        .otp-status.show { display: block; }
        .otp-status.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .otp-status.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .otp-status.info { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }

        #otp_input_section {
            display: none;
            margin-top: 8px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        #otp_input_section.show { display: block; }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .back-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .security-note {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .login-container { padding: 28px 20px; }
            .login-header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width: 14px; height: 14px;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Secure Mother Portal Access
            </div>
            <h1>Welcome Back</h1>
            <p>We'll send a one-time code to your registered phone number to verify it's you.</p>
        </div>

        <div id="otp_status" class="otp-status"></div>

        <div class="form-group">
            <label for="login_phone">Phone Number</label>
            <input
                type="tel"
                id="login_phone"
                inputmode="tel"
                autocomplete="tel"
                placeholder="e.g., 0712 345 678"
            >
        </div>

        <button id="send_otp_btn" class="btn-primary" onclick="requestOTP()">
            Send OTP Code
        </button>

        <div id="otp_input_section">
            <div class="form-group">
                <label for="otp_code">6-digit Code</label>
                <input
                    type="text"
                    id="otp_code"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="••••••"
                    maxlength="6"
                    style="letter-spacing: 8px; text-align: center; font-size: 20px; font-weight: 700;"
                >
            </div>
            <button id="verify_otp_btn" class="btn-primary" onclick="verifyOTP()">
                Verify & Login
            </button>
            <p style="text-align: center; margin-top: 12px; font-size: 13px; color: #64748b;">
                Didn't receive it? <a href="#" onclick="requestOTP(); return false;" style="color: #3b82f6; font-weight: 600; text-decoration: none;">Resend code</a>
            </p>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>

        <p class="security-note">
            Your health data is protected. We never ask for passwords — only a code sent to your phone.
        </p>
    </div>

    <script>
        var SUPABASE_URL = 'https://fmaaudmdgmgklvqcmvad.supabase.co';
        var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtYWF1ZG1kZ21na2x2cWNtdmFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzk2MjMsImV4cCI6MjEwMjcxNTYyM30.yGKizF1gywUIctA_VKDVuI9YO8rH7i-kfQ2RfDb2u_E';
        var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var rateLimitAttempts = {};

        function setStatus(msg, type) {
            var el = document.getElementById('otp_status');
            el.textContent = msg;
            el.className = 'otp-status show ' + type;
        }

        function normalizePhone(phone) {
            var digits = phone.replace(/\D/g, '');
            if (digits.length === 9 && (digits[0] === '6' || digits[0] === '7')) return '+255' + digits;
            if (digits.length === 10 && digits[0] === '0') return '+255' + digits.slice(1);
            if (digits.length === 12 && digits.indexOf('255') === 0) return '+' + digits;
            if (digits.length === 13 && digits[0] === '+') return digits;
            return null;
        }

        function checkRateLimit(phone) {
            var now = Date.now();
            var windowMs = 15 * 60 * 1000;
            if (!rateLimitAttempts[phone]) rateLimitAttempts[phone] = [];
            rateLimitAttempts[phone] = rateLimitAttempts[phone].filter(function (t) { return now - t < windowMs; });
            if (rateLimitAttempts[phone].length >= 3) return false;
            rateLimitAttempts[phone].push(now);
            return true;
        }

        async function checkAuth() {
            try {
                var sess = await sb.auth.getSession();
                if (sess.data && sess.data.session) {
                    window.location.href = 'mother-dashboard.html';
                }
            } catch (e) {}
        }

        window.requestOTP = async function () {
            var phoneInput = document.getElementById('login_phone').value.trim();
            var sendBtn = document.getElementById('send_otp_btn');
            var normalized = normalizePhone(phoneInput);

            if (!normalized) {
                setStatus('Please enter a valid Tanzanian phone number.', 'error');
                return;
            }

            if (!checkRateLimit(normalized)) {
                setStatus('Too many attempts. Please wait 15 minutes before trying again.', 'error');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            try {
                var { error } = await sb.auth.signInWithOtp({
                    phone: normalized,
                    options: { shouldCreateUser: false }
                });

                // Generic message regardless of outcome - prevents phone enumeration
                setStatus('If this number is registered, you will receive an OTP via SMS shortly.', 'info');
                document.getElementById('otp_input_section').classList.add('show');
                document.getElementById('otp_code').focus();
            } catch (err) {
                setStatus('Could not send OTP. Please try again.', 'error');
            }

            sendBtn.disabled = false;
            sendBtn.textContent = 'Send OTP Code';
        };

        window.verifyOTP = async function () {
            var phoneInput = document.getElementById('login_phone').value.trim();
            var otp = document.getElementById('otp_code').value.trim();
            var verifyBtn = document.getElementById('verify_otp_btn');
            var normalized = normalizePhone(phoneInput);

            if (!otp || otp.length !== 6 || !/^\d{6}$/.test(otp)) {
                setStatus('Please enter the 6-digit code sent to your phone.', 'error');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';

            try {
                var { data, error } = await sb.auth.verifyOtp({
                    phone: normalized,
                    token: otp,
                    type: 'sms'
                });

                if (error) {
                    setStatus('Invalid or expired code. Please try again.', 'error');
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Verify & Login';
                    return;
                }

                setStatus('Verified! Redirecting to your dashboard...', 'success');
                setTimeout(function () {
                    window.location.href = 'mother-dashboard.html';
                }, 800);
            } catch (err) {
                setStatus('Verification failed. Please try again.', 'error');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify & Login';
            }
        };

        // Allow Enter key to submit OTP
        document.getElementById('otp_code').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifyOTP();
        });
        document.getElementById('login_phone').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') requestOTP();
        });

        checkAuth();
    </script>
</body>
</html>
